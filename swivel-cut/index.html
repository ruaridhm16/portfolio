<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            if (localStorage.getItem('t') !== null) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SwivelCut Path Visualiser</title>

    <link rel="icon" href="../logo-light.png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="../logo-dark.png" media="(prefers-color-scheme: dark)">

    <link
        rel="preload"
        href="../misc/fonts/PlusJakartaSans-Variable.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <style>
        @font-face {
            font-family: 'Plus Jakarta Sans';
            src: url('../misc/fonts/PlusJakartaSans-Variable.woff2') format('woff2');
            font-weight: 300 800;
            font-style: normal;
            font-display: optional;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #4c47e2;
            --black: #111111;
            --mid: #5c5c5c;
            --border: #bdbdbd;
            --bg: #d7d7d7;
            --shadow: #a8a8a8;
            --surface: #cbcbcb;
            --button-surface: #d7d7d7;
            --workspace: #b0b0b0;
        }

        html.dark {
            --black: #f0f0f0;
            --mid: #a0a0a0;
            --border: #2a2a2a;
            --bg: #111111;
            --shadow: #000000;
            --surface: #222222;
            --button-surface: #191919;
            --workspace: #343434;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--black);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        button,
        input {
            font: inherit;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 72px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .back-link {
            color: var(--mid);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        main {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 72px 60px;
        }

        .layout {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
        }

        .stage-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition:
                background 0.3s ease,
                border-color 0.3s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        .stage-caption {
            color: var(--mid);
            font-size: 12px;
            font-weight: 500;
            opacity: 0.75;
        }

        .panel {
            min-height: 70px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition:
                background 0.3s ease,
                border-color 0.3s ease;
        }

        button {
            padding: 9px 14px;
            background: var(--button-surface);
            color: var(--black);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition:
                border-color 0.15s,
                color 0.15s,
                box-shadow 0.15s,
                opacity 0.15s;
        }

        button:hover:not(:disabled) {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 2px 2px 0 var(--accent);
        }

        button.primary {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        button.primary:hover:not(:disabled) {
            color: #ffffff;
            box-shadow: 3px 3px 0 var(--shadow);
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--mid);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-row input:disabled {
            cursor: default;
        }

        .panel-divider {
            width: 1px;
            height: 30px;
            background: var(--border);
        }

        .stats {
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .stats div,
        .joint-stack div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .stats span:first-child,
        .joint-stack span:first-child {
            color: var(--mid);
        }

        .stats span:last-child,
        .joint-stack span:last-child {
            color: var(--black);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .joint-stack {
            min-width: 178px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        footer.site-footer {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 72px 32px;
            color: var(--mid);
            font-size: 12px;
            font-weight: 500;
        }

        footer.site-footer a {
            color: var(--mid);
            text-decoration: none;
        }

        footer.site-footer a:hover {
            color: var(--accent);
        }

        @media (max-width: 700px) {
            header {
                padding: 20px;
            }

            main {
                padding: 0 20px 40px;
            }

            .panel {
                align-items: flex-start;
            }

            .panel-divider {
                display: none;
            }

            .stats,
            .joint-stack {
                width: 100%;
            }

            footer.site-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 16px 20px 28px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>SwivelCut</h1>
        <a class="back-link" href="../index.html">Back</a>
    </header>

    <main>
        <div class="layout">
            <div class="stage-wrapper">
                <canvas
                    id="stage"
                    width="1000"
                    height="1000"
                    aria-label="Interactive SwivelCut arm path visualiser"
                ></canvas>
            </div>

            <p class="stage-caption">
                Draw a path inside the working area, then play to simulate
                the cutting movement.
            </p>

            <div class="panel">
                <button id="playBtn" class="primary">Play</button>
                <button id="clearBtn">Clear path</button>

                <label class="checkbox-row">
                    <input type="checkbox" id="stabilizeCheckbox">
                    Stabilisation
                </label>

                <div class="panel-divider" aria-hidden="true"></div>

                <div class="stats">
                    <div>
                        <span>Blade</span>
                        <span id="bladeVal">UP</span>
                    </div>
                </div>

                <div class="joint-stack">
                    <div>
                        <span>Shoulder joint</span>
                        <span id="j1Val">0.0&deg;</span>
                    </div>

                    <div>
                        <span>Elbow joint</span>
                        <span id="j2Val">180.0&deg;</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
    </footer>

    <script>
        const LINK_1_MM = 260;
        const LINK_2_MM = 255;

        const J1_MIN_DEG = -90;
        const J1_MAX_DEG = 90;
        const J2_MIN_DEG = -180;
        const J2_MAX_DEG = 180;

        const HOME_J1_DEG = 0;
        const HOME_J2_DEG = 180;

        const PLAYBACK_SPEED_DEG_PER_SEC = 180;

        const PRODUCT_SMOOTHING_MS = 150;
        const PRODUCT_MAX_DEVIATION_DEG = 1.0;

        const rad = degrees => degrees * Math.PI / 180;
        const deg = radians => radians * 180 / Math.PI;

        function normalizeJointDegrees(degrees) {
            while (degrees > 180) degrees -= 360;
            while (degrees < -180) degrees += 360;
            return degrees;
        }

        function shortestJointDelta(targetDeg, currentDeg) {
            return normalizeJointDegrees(targetDeg - currentDeg);
        }

        function angleInRange(j1Deg, j2Deg) {
            return (
                j1Deg >= J1_MIN_DEG &&
                j1Deg <= J1_MAX_DEG &&
                j2Deg >= J2_MIN_DEG &&
                j2Deg <= J2_MAX_DEG
            );
        }

        function forwardKinematics(j1Deg, j2Deg) {
            const t1 = rad(j1Deg);
            const t2 = rad(j2Deg);

            const elbowX = -LINK_1_MM * Math.sin(t1);
            const elbowY = LINK_1_MM * Math.cos(t1);

            const tipX = elbowX + LINK_2_MM * Math.sin(t2 - t1);
            const tipY = elbowY + LINK_2_MM * Math.cos(t2 - t1);

            return {
                elbow: {
                    x: elbowX,
                    y: elbowY
                },
                tip: {
                    x: tipX,
                    y: tipY
                }
            };
        }

        const TRAIL_BLADE_MM = 15;
        const TRAIL_MAX_TURN_RATE_DEG_PER_SEC = 1000;
        const OVERCUT_RUNWAY_MM = TRAIL_BLADE_MM * 4;

        function normalizeAngleRad(angle) {
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            return angle;
        }

        function inverseKinematics(x, y, elbowDown) {
            const c2raw =
                (
                    x * x +
                    y * y -
                    LINK_1_MM * LINK_1_MM -
                    LINK_2_MM * LINK_2_MM
                ) /
                (2 * LINK_1_MM * LINK_2_MM);

            if (c2raw < -1.00001 || c2raw > 1.00001) {
                return null;
            }

            const c2 = Math.min(1, Math.max(-1, c2raw));
            let s2 = Math.sqrt(Math.max(0, 1 - c2 * c2));

            if (elbowDown) {
                s2 = -s2;
            }

            const t2 = Math.atan2(s2, c2);

            const t1 =
                Math.atan2(x, y) -
                Math.atan2(
                    LINK_2_MM * s2,
                    LINK_1_MM + LINK_2_MM * c2
                );

            const j1Deg = -deg(t1);
            const j2Deg = deg(t2);

            if (!angleInRange(j1Deg, j2Deg)) {
                return null;
            }

            return {
                j1Deg,
                j2Deg
            };
        }

        function isPointReachable(x, y) {
            return (
                inverseKinematics(x, y, true) !== null ||
                inverseKinematics(x, y, false) !== null
            );
        }

        function smoothPathXY(points, smoothingMs, maxDeviationDeg) {
            if (points.length < 3 || smoothingMs <= 0) {
                return points;
            }

            const smoothed = points.map(point => ({
                x: point.x,
                y: point.y,
                t: point.t
            }));

            const windowFractions = [1, 0.5, 0.25, 0];

            for (let i = 0; i < points.length; i++) {
                const rawX = points[i].x;
                const rawY = points[i].y;

                const reachMm = Math.max(Math.hypot(rawX, rawY), 20);
                const maxDeviationMm = rad(maxDeviationDeg) * reachMm;
                const elbowDown = rawX < 0;

                let solved = false;

                for (const fraction of windowFractions) {
                    const windowMs = smoothingMs * fraction;

                    let sx = rawX;
                    let sy = rawY;

                    if (windowMs > 0) {
                        let sumX = 0;
                        let sumY = 0;
                        let count = 0;

                        for (const point of points) {
                            if (
                                Math.abs(
                                    (point.t - points[i].t) * 1000
                                ) <= windowMs
                            ) {
                                sumX += point.x;
                                sumY += point.y;
                                count++;
                            }
                        }

                        sx = sumX / count;
                        sy = sumY / count;
                    }

                    if (maxDeviationDeg > 0) {
                        sx = Math.min(
                            rawX + maxDeviationMm,
                            Math.max(rawX - maxDeviationMm, sx)
                        );

                        sy = Math.min(
                            rawY + maxDeviationMm,
                            Math.max(rawY - maxDeviationMm, sy)
                        );
                    }

                    if (inverseKinematics(sx, sy, elbowDown)) {
                        smoothed[i].x = sx;
                        smoothed[i].y = sy;
                        solved = true;
                        break;
                    }
                }

                if (!solved) {
                    smoothed[i].x = rawX;
                    smoothed[i].y = rawY;
                }
            }

            smoothed[0] = {
                ...points[0]
            };

            smoothed[smoothed.length - 1] = {
                ...points[points.length - 1]
            };

            return smoothed;
        }

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        const REACH_MM = LINK_1_MM + LINK_2_MM;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + canvas.height * 0.18;
        const scale = (canvas.height * 0.42) / REACH_MM;

        const toScreen = (x, y) => ({
            x: centerX + x * scale,
            y: centerY - y * scale
        });

        const toMm = (px, py) => ({
            x: (px - centerX) / scale,
            y: (centerY - py) / scale
        });

        const REACH_BOUNDARY_SAMPLES = 180;

        function maxReachableRadius(dirX, dirY) {
            let best = 0;

            for (let radius = 2; radius <= REACH_MM; radius += 2) {
                if (isPointReachable(dirX * radius, dirY * radius)) {
                    best = radius;
                }
            }

            return best;
        }

        const reachBoundary = Array.from(
            {
                length: REACH_BOUNDARY_SAMPLES
            },
            (_, index) => {
                const phi =
                    (index / REACH_BOUNDARY_SAMPLES) *
                    Math.PI *
                    2;

                const radius = maxReachableRadius(
                    Math.cos(phi),
                    Math.sin(phi)
                );

                return {
                    phi,
                    r: radius
                };
            }
        );

        function boundaryRadiusAt(phi) {
            let normalized = phi % (Math.PI * 2);

            if (normalized < 0) {
                normalized += Math.PI * 2;
            }

            const scaled =
                (normalized / (Math.PI * 2)) *
                REACH_BOUNDARY_SAMPLES;

            const i0 =
                Math.floor(scaled) %
                REACH_BOUNDARY_SAMPLES;

            const i1 =
                (i0 + 1) %
                REACH_BOUNDARY_SAMPLES;

            const fraction =
                scaled -
                Math.floor(scaled);

            return (
                reachBoundary[i0].r +
                (
                    reachBoundary[i1].r -
                    reachBoundary[i0].r
                ) *
                fraction
            );
        }

        function clampToReachable(x, y) {
            const radius = Math.hypot(x, y);

            if (radius === 0) {
                return {
                    x,
                    y
                };
            }

            const boundaryRadius = boundaryRadiusAt(
                Math.atan2(y, x)
            );

            if (radius <= boundaryRadius) {
                return {
                    x,
                    y
                };
            }

            const clampScale = boundaryRadius / radius;

            return {
                x: x * clampScale,
                y: y * clampScale
            };
        }

        const HOME_DEADZONE_RADIUS_MM = 40;

        const homeArmSegment = (() => {
            const forward = forwardKinematics(
                HOME_J1_DEG,
                HOME_J2_DEG
            );

            return {
                ax: 0,
                ay: 0,
                bx: forward.elbow.x,
                by: forward.elbow.y
            };
        })();

        function nearestPointOnSegment(
            px,
            py,
            ax,
            ay,
            bx,
            by
        ) {
            const dx = bx - ax;
            const dy = by - ay;
            const lengthSquared = dx * dx + dy * dy;

            let position =
                lengthSquared > 0
                    ? (
                        (px - ax) * dx +
                        (py - ay) * dy
                    ) / lengthSquared
                    : 0;

            position = Math.max(
                0,
                Math.min(1, position)
            );

            return {
                x: ax + dx * position,
                y: ay + dy * position
            };
        }

        function pushOutOfHomeDeadzone(x, y) {
            const segment = homeArmSegment;

            const nearest = nearestPointOnSegment(
                x,
                y,
                segment.ax,
                segment.ay,
                segment.bx,
                segment.by
            );

            const dx = x - nearest.x;
            const dy = y - nearest.y;
            const distance = Math.hypot(dx, dy);

            if (distance >= HOME_DEADZONE_RADIUS_MM) {
                return {
                    x,
                    y
                };
            }

            if (distance < 1e-6) {
                return {
                    x: nearest.x + HOME_DEADZONE_RADIUS_MM,
                    y: nearest.y
                };
            }

            const pushScale =
                HOME_DEADZONE_RADIUS_MM /
                distance;

            return {
                x: nearest.x + dx * pushScale,
                y: nearest.y + dy * pushScale
            };
        }

        function clampToDrawable(x, y) {
            const reachable = clampToReachable(x, y);

            return pushOutOfHomeDeadzone(
                reachable.x,
                reachable.y
            );
        }

        let drawnPoints = [];
        let strokeStartMs = 0;
        let isDrawing = false;
        let isPlaying = false;
        let stabilizationEnabled = false;

        let arm = {
            j1: HOME_J1_DEG,
            j2: HOME_J2_DEG
        };

        let bladeDown = false;
        let trail = [];

        const PHYSICS_DT = 0.004;

        function stepCountFor(
            jointDistanceDeg,
            speedDegPerSec
        ) {
            return Math.max(
                1,
                Math.ceil(
                    jointDistanceDeg /
                    speedDegPerSec /
                    PHYSICS_DT
                )
            );
        }

        let trailBladeAngleRad = 0;
        let trailBladeLastPivot = null;

        function trailingBladeTip(pivot) {
            return {
                x:
                    pivot.x +
                    TRAIL_BLADE_MM *
                    Math.cos(trailBladeAngleRad),

                y:
                    pivot.y +
                    TRAIL_BLADE_MM *
                    Math.sin(trailBladeAngleRad)
            };
        }

        function advanceTrailAngle(
            currentAngleRad,
            dx,
            dy,
            dtSeconds
        ) {
            if (
                dtSeconds <= 0 ||
                Math.hypot(dx, dy) <= 1e-4
            ) {
                return currentAngleRad;
            }

            const desiredAngle = Math.atan2(-dy, -dx);

            const maxStep =
                rad(
                    TRAIL_MAX_TURN_RATE_DEG_PER_SEC
                ) *
                dtSeconds;

            const delta = normalizeAngleRad(
                desiredAngle - currentAngleRad
            );

            return normalizeAngleRad(
                currentAngleRad +
                Math.max(
                    -maxStep,
                    Math.min(maxStep, delta)
                )
            );
        }

        function updateTrailingBlade(pivot) {
            if (trailBladeLastPivot === null) {
                trailBladeLastPivot = pivot;
                return;
            }

            const dx =
                pivot.x -
                trailBladeLastPivot.x;

            const dy =
                pivot.y -
                trailBladeLastPivot.y;

            trailBladeLastPivot = pivot;

            trailBladeAngleRad = advanceTrailAngle(
                trailBladeAngleRad,
                dx,
                dy,
                PHYSICS_DT
            );
        }

        function resetTrailingBlade() {
            const forward = forwardKinematics(
                arm.j1,
                arm.j2
            );

            trailBladeAngleRad = Math.atan2(
                forward.tip.y - forward.elbow.y,
                forward.tip.x - forward.elbow.x
            );

            trailBladeLastPivot = null;
        }

        resetTrailingBlade();

        const playBtn =
            document.getElementById('playBtn');

        const clearBtn =
            document.getElementById('clearBtn');

        const stabilizeCheckbox =
            document.getElementById(
                'stabilizeCheckbox'
            );

        const bladeVal =
            document.getElementById('bladeVal');

        const j1ValEl =
            document.getElementById('j1Val');

        const j2ValEl =
            document.getElementById('j2Val');

        stabilizeCheckbox.addEventListener(
            'change',
            () => {
                stabilizationEnabled =
                    stabilizeCheckbox.checked;
            }
        );

        function pointerPos(event) {
            const rect =
                canvas.getBoundingClientRect();

            const clientX = event.touches
                ? event.touches[0].clientX
                : event.clientX;

            const clientY = event.touches
                ? event.touches[0].clientY
                : event.clientY;

            const scaleX =
                canvas.width / rect.width;

            const scaleY =
                canvas.height / rect.height;

            return {
                px:
                    (clientX - rect.left) *
                    scaleX,

                py:
                    (clientY - rect.top) *
                    scaleY
            };
        }

        function startDrawing(event) {
            if (isPlaying) {
                return;
            }

            isDrawing = true;
            drawnPoints = [];
            strokeStartMs = performance.now();

            addPoint(event);
        }

        function addPoint(event) {
            if (!isDrawing) {
                return;
            }

            const {
                px,
                py
            } = pointerPos(event);

            const raw = toMm(px, py);

            const millimetres = clampToDrawable(
                raw.x,
                raw.y
            );

            const last =
                drawnPoints[
                    drawnPoints.length - 1
                ];

            if (
                !last ||
                Math.hypot(
                    millimetres.x - last.x,
                    millimetres.y - last.y
                ) > 3
            ) {
                const time =
                    (
                        performance.now() -
                        strokeStartMs
                    ) /
                    1000;

                drawnPoints.push({
                    x: millimetres.x,
                    y: millimetres.y,
                    t: time
                });

                render();
            }

            event.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener(
            'mousedown',
            startDrawing
        );

        canvas.addEventListener(
            'mousemove',
            addPoint
        );

        window.addEventListener(
            'mouseup',
            stopDrawing
        );

        canvas.addEventListener(
            'touchstart',
            startDrawing,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            'touchmove',
            addPoint,
            {
                passive: false
            }
        );

        canvas.addEventListener(
            'touchend',
            stopDrawing
        );

        clearBtn.addEventListener(
            'click',
            () => {
                if (isPlaying) {
                    return;
                }

                drawnPoints = [];
                trail = [];

                arm = {
                    j1: HOME_J1_DEG,
                    j2: HOME_J2_DEG
                };

                bladeDown = false;

                resetTrailingBlade();
                render();
            }
        );

        function cssVariable(name) {
            return getComputedStyle(
                document.documentElement
            )
                .getPropertyValue(name)
                .trim();
        }

        function render() {
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.beginPath();

            reachBoundary.forEach(
                (point, index) => {
                    const screen = toScreen(
                        point.r *
                        Math.cos(point.phi),

                        point.r *
                        Math.sin(point.phi)
                    );

                    if (index === 0) {
                        ctx.moveTo(
                            screen.x,
                            screen.y
                        );
                    } else {
                        ctx.lineTo(
                            screen.x,
                            screen.y
                        );
                    }
                }
            );

            ctx.closePath();
            ctx.fillStyle =
                cssVariable('--workspace');

            ctx.fill();

            ctx.save();

            ctx.globalCompositeOperation =
                'destination-out';

            const deadzoneA = toScreen(
                homeArmSegment.ax,
                homeArmSegment.ay
            );

            const deadzoneB = toScreen(
                homeArmSegment.bx,
                homeArmSegment.by
            );

            ctx.lineWidth =
                HOME_DEADZONE_RADIUS_MM *
                2 *
                scale;

            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';

            ctx.beginPath();

            ctx.moveTo(
                deadzoneA.x,
                deadzoneA.y
            );

            ctx.lineTo(
                deadzoneB.x,
                deadzoneB.y
            );

            ctx.stroke();
            ctx.restore();

            if (drawnPoints.length > 1) {
                ctx.lineWidth = 2;
                ctx.strokeStyle =
                    cssVariable('--black');

                ctx.beginPath();

                drawnPoints.forEach(
                    (point, index) => {
                        const screen = toScreen(
                            point.x,
                            point.y
                        );

                        if (index === 0) {
                            ctx.moveTo(
                                screen.x,
                                screen.y
                            );
                        } else {
                            ctx.lineTo(
                                screen.x,
                                screen.y
                            );
                        }
                    }
                );

                ctx.stroke();
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = '#e0332f';

            trail.forEach(segment => {
                const start = toScreen(
                    segment.x1,
                    segment.y1
                );

                const end = toScreen(
                    segment.x2,
                    segment.y2
                );

                ctx.beginPath();

                ctx.moveTo(
                    start.x,
                    start.y
                );

                ctx.lineTo(
                    end.x,
                    end.y
                );

                ctx.stroke();
            });

            const {
                elbow,
                tip: pivot
            } = forwardKinematics(
                arm.j1,
                arm.j2
            );

            const bladeTip =
                trailingBladeTip(pivot);

            const base = toScreen(0, 0);

            const elbowScreen = toScreen(
                elbow.x,
                elbow.y
            );

            const pivotScreen = toScreen(
                pivot.x,
                pivot.y
            );

            const bladeTipScreen = toScreen(
                bladeTip.x,
                bladeTip.y
            );

            ctx.lineWidth = 60;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4C47E240';

            ctx.beginPath();

            ctx.moveTo(
                base.x,
                base.y
            );

            ctx.lineTo(
                elbowScreen.x,
                elbowScreen.y
            );

            ctx.stroke();

            ctx.strokeStyle = '#4C47E240';

            ctx.beginPath();

            ctx.moveTo(
                elbowScreen.x,
                elbowScreen.y
            );

            ctx.lineTo(
                pivotScreen.x,
                pivotScreen.y
            );

            ctx.stroke();

            ctx.lineWidth = 15;
            ctx.setLineDash([3, 3]);
            ctx.strokeStyle =
                cssVariable('--black');

            ctx.beginPath();

            ctx.moveTo(
                pivotScreen.x,
                pivotScreen.y
            );

            ctx.lineTo(
                bladeTipScreen.x,
                bladeTipScreen.y
            );

            ctx.stroke();
            ctx.setLineDash([]);

            [
                base,
                elbowScreen,
                pivotScreen
            ].forEach(point => {
                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    7,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = '#1a1d22';
                ctx.fill();
            });

            ctx.beginPath();

            ctx.arc(
                bladeTipScreen.x,
                bladeTipScreen.y,
                8,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = bladeDown
                ? '#e0332f'
                : '#6b7280';

            ctx.fill();

            updateStats();
        }

        function updateStats() {
            j1ValEl.textContent =
                `${arm.j1.toFixed(1)}°`;

            j2ValEl.textContent =
                `${arm.j2.toFixed(1)}°`;

            bladeVal.textContent =
                bladeDown
                    ? 'DOWN'
                    : 'UP';
        }

        render();

        function groupIntoElbowRuns(points) {
            const runs = [];

            let current = [];
            let currentElbow = null;
            let skippedPoints = 0;

            for (const point of points) {
                if (
                    currentElbow !== null &&
                    inverseKinematics(
                        point.x,
                        point.y,
                        currentElbow
                    )
                ) {
                    current.push(point);
                    continue;
                }

                if (current.length > 0) {
                    runs.push({
                        elbow: currentElbow,
                        points: current
                    });
                }

                current = [];
                currentElbow = null;

                const preferredElbow =
                    point.x < 0;

                let elbow =
                    preferredElbow;

                if (
                    !inverseKinematics(
                        point.x,
                        point.y,
                        elbow
                    )
                ) {
                    elbow = !preferredElbow;

                    if (
                        !inverseKinematics(
                            point.x,
                            point.y,
                            elbow
                        )
                    ) {
                        skippedPoints++;
                        continue;
                    }
                }

                currentElbow = elbow;
                current.push(point);
            }

            if (current.length > 0) {
                runs.push({
                    elbow: currentElbow,
                    points: current
                });
            }

            return {
                runs,
                skippedPoints
            };
        }

        function overcutApproachPoint(
            points,
            elbow
        ) {
            if (points.length < 2) {
                return null;
            }

            const dx =
                points[1].x -
                points[0].x;

            const dy =
                points[1].y -
                points[0].y;

            const length =
                Math.hypot(dx, dy);

            if (length < 1e-6) {
                return null;
            }

            const unitX = dx / length;
            const unitY = dy / length;

            const fractions = [
                1,
                0.5,
                0.25,
                0.125,
                0.0625,
                0.03,
                0.015
            ];

            for (const fraction of fractions) {
                const distanceMm =
                    OVERCUT_RUNWAY_MM *
                    fraction;

                const candidateX =
                    points[0].x -
                    unitX *
                    distanceMm;

                const candidateY =
                    points[0].y -
                    unitY *
                    distanceMm;

                if (
                    inverseKinematics(
                        candidateX,
                        candidateY,
                        elbow
                    )
                ) {
                    return {
                        x: candidateX,
                        y: candidateY
                    };
                }
            }

            return null;
        }

        function solveElbowRuns(topology) {
            let reference =
                HOME_J2_DEG;

            const solveOne = (
                point,
                elbow
            ) => {
                const solved =
                    inverseKinematics(
                        point.x,
                        point.y,
                        elbow
                    );

                const j2Unwrapped =
                    reference +
                    shortestJointDelta(
                        solved.j2Deg,
                        reference
                    );

                reference =
                    j2Unwrapped;

                return {
                    j1: solved.j1Deg,
                    j2: j2Unwrapped
                };
            };

            return topology.map(
                ({
                    elbow,
                    points
                }) => {
                    const approachPoint =
                        overcutApproachPoint(
                            points,
                            elbow
                        );

                    const approach =
                        approachPoint
                            ? solveOne(
                                approachPoint,
                                elbow
                            )
                            : null;

                    return {
                        approach,

                        points: points.map(
                            point =>
                                solveOne(
                                    point,
                                    elbow
                                )
                        )
                    };
                }
            );
        }

        function simulateBladeArrivals(
            runs,
            speedDegPerSec
        ) {
            let simJ1 =
                HOME_J1_DEG;

            let simJ2 =
                HOME_J2_DEG;

            const homeForward =
                forwardKinematics(
                    simJ1,
                    simJ2
                );

            let simAngle =
                Math.atan2(
                    homeForward.tip.y -
                    homeForward.elbow.y,

                    homeForward.tip.x -
                    homeForward.elbow.x
                );

            let simLastPivot =
                homeForward.tip;

            function driveTo(target) {
                const startJ1 =
                    simJ1;

                const startJ2 =
                    simJ2;

                const distance =
                    Math.max(
                        Math.abs(
                            target.j1 -
                            startJ1
                        ),

                        Math.abs(
                            target.j2 -
                            startJ2
                        )
                    );

                const steps =
                    stepCountFor(
                        distance,
                        speedDegPerSec
                    );

                for (
                    let step = 1;
                    step <= steps;
                    step++
                ) {
                    const fraction =
                        step / steps;

                    simJ1 =
                        startJ1 +
                        (
                            target.j1 -
                            startJ1
                        ) *
                        fraction;

                    simJ2 =
                        startJ2 +
                        (
                            target.j2 -
                            startJ2
                        ) *
                        fraction;

                    const pivot =
                        forwardKinematics(
                            simJ1,
                            simJ2
                        ).tip;

                    simAngle =
                        advanceTrailAngle(
                            simAngle,

                            pivot.x -
                            simLastPivot.x,

                            pivot.y -
                            simLastPivot.y,

                            PHYSICS_DT
                        );

                    simLastPivot =
                        pivot;
                }

                return {
                    x:
                        simLastPivot.x +
                        TRAIL_BLADE_MM *
                        Math.cos(simAngle),

                    y:
                        simLastPivot.y +
                        TRAIL_BLADE_MM *
                        Math.sin(simAngle)
                };
            }

            return runs.map(run => {
                if (run.approach) {
                    driveTo(run.approach);
                }

                return run.points.map(
                    target =>
                        driveTo(target)
                );
            });
        }

        function computeBladeCompensatedPath(
            desiredPoints,
            speedDegPerSec
        ) {
            const {
                runs: topology,
                skippedPoints
            } = groupIntoElbowRuns(
                desiredPoints
            );

            if (topology.length === 0) {
                return {
                    runs: [],
                    skippedPoints
                };
            }

            const state = topology.map(
                ({
                    elbow,
                    points
                }) => ({
                    elbow,

                    points: points.map(
                        (point, index) => {
                            const previous =
                                points[
                                    Math.max(
                                        0,
                                        index - 1
                                    )
                                ];

                            const next =
                                points[
                                    Math.min(
                                        points.length - 1,
                                        index + 1
                                    )
                                ];

                            const dx =
                                next.x -
                                previous.x;

                            const dy =
                                next.y -
                                previous.y;

                            const length =
                                Math.hypot(
                                    dx,
                                    dy
                                );

                            let x =
                                point.x;

                            let y =
                                point.y;

                            if (
                                length >= 1e-6
                            ) {
                                const candidateX =
                                    point.x +
                                    TRAIL_BLADE_MM *
                                    dx /
                                    length;

                                const candidateY =
                                    point.y +
                                    TRAIL_BLADE_MM *
                                    dy /
                                    length;

                                if (
                                    inverseKinematics(
                                        candidateX,
                                        candidateY,
                                        elbow
                                    )
                                ) {
                                    x =
                                        candidateX;

                                    y =
                                        candidateY;
                                }
                            }

                            return {
                                x,
                                y,

                                desiredX:
                                    point.x,

                                desiredY:
                                    point.y
                            };
                        }
                    )
                })
            );

            const iterations = 6;
            const gain = 0.85;

            const asTopology = () =>
                state.map(run => ({
                    elbow:
                        run.elbow,

                    points:
                        run.points
                }));

            let jointRuns =
                solveElbowRuns(
                    asTopology()
                );

            for (
                let iteration = 0;
                iteration < iterations;
                iteration++
            ) {
                const arrivals =
                    simulateBladeArrivals(
                        jointRuns,
                        speedDegPerSec
                    );

                for (
                    let runIndex = 0;
                    runIndex < state.length;
                    runIndex++
                ) {
                    for (
                        let pointIndex = 0;
                        pointIndex <
                        state[runIndex]
                            .points
                            .length;
                        pointIndex++
                    ) {
                        const point =
                            state[
                                runIndex
                            ].points[
                                pointIndex
                            ];

                        const actual =
                            arrivals[
                                runIndex
                            ][
                                pointIndex
                            ];

                        const nextX =
                            point.x +
                            gain *
                            (
                                point.desiredX -
                                actual.x
                            );

                        const nextY =
                            point.y +
                            gain *
                            (
                                point.desiredY -
                                actual.y
                            );

                        if (
                            inverseKinematics(
                                nextX,
                                nextY,
                                state[
                                    runIndex
                                ].elbow
                            )
                        ) {
                            point.x =
                                nextX;

                            point.y =
                                nextY;
                        }
                    }
                }

                jointRuns =
                    solveElbowRuns(
                        asTopology()
                    );
            }

            return {
                runs: jointRuns,
                skippedPoints
            };
        }

        function animateTo(
            target,
            speedDegPerSec,
            traceTrail
        ) {
            return new Promise(
                resolve => {
                    const start = {
                        j1: arm.j1,
                        j2: arm.j2
                    };

                    const distance =
                        Math.max(
                            Math.abs(
                                target.j1 -
                                start.j1
                            ),

                            Math.abs(
                                target.j2 -
                                start.j2
                            )
                        );

                    const totalSteps =
                        stepCountFor(
                            distance,
                            speedDegPerSec
                        );

                    let stepsDone = 0;

                    let lastBladeTip =
                        trailingBladeTip(
                            forwardKinematics(
                                arm.j1,
                                arm.j2
                            ).tip
                        );

                    let accumulatorSeconds = 0;
                    let lastNow = null;

                    function substep() {
                        stepsDone++;

                        const fraction =
                            stepsDone /
                            totalSteps;

                        arm.j1 =
                            start.j1 +
                            (
                                target.j1 -
                                start.j1
                            ) *
                            fraction;

                        arm.j2 =
                            start.j2 +
                            (
                                target.j2 -
                                start.j2
                            ) *
                            fraction;

                        const pivot =
                            forwardKinematics(
                                arm.j1,
                                arm.j2
                            ).tip;

                        updateTrailingBlade(
                            pivot
                        );

                        const bladeTip =
                            trailingBladeTip(
                                pivot
                            );

                        if (traceTrail) {
                            trail.push({
                                x1:
                                    lastBladeTip.x,

                                y1:
                                    lastBladeTip.y,

                                x2:
                                    bladeTip.x,

                                y2:
                                    bladeTip.y
                            });
                        }

                        lastBladeTip =
                            bladeTip;
                    }

                    function frame(now) {
                        if (lastNow === null) {
                            lastNow = now;
                        }

                        accumulatorSeconds =
                            Math.min(
                                accumulatorSeconds +
                                (
                                    now -
                                    lastNow
                                ) /
                                1000,

                                0.25
                            );

                        lastNow = now;

                        while (
                            accumulatorSeconds >=
                                PHYSICS_DT &&
                            stepsDone <
                                totalSteps
                        ) {
                            substep();

                            accumulatorSeconds -=
                                PHYSICS_DT;
                        }

                        render();

                        if (
                            stepsDone <
                            totalSteps
                        ) {
                            requestAnimationFrame(
                                frame
                            );
                        } else {
                            resolve();
                        }
                    }

                    requestAnimationFrame(
                        frame
                    );
                }
            );
        }

        async function play() {
            const sourcePoints =
                stabilizationEnabled
                    ? smoothPathXY(
                        drawnPoints,
                        PRODUCT_SMOOTHING_MS,
                        PRODUCT_MAX_DEVIATION_DEG
                    )
                    : drawnPoints;

            const speed =
                PLAYBACK_SPEED_DEG_PER_SEC;

            playBtn.disabled = true;
            clearBtn.disabled = true;
            stabilizeCheckbox.disabled = true;

            await new Promise(
                resolve =>
                    setTimeout(resolve, 0)
            );

            const {
                runs
            } = computeBladeCompensatedPath(
                sourcePoints,
                speed
            );

            if (runs.length === 0) {
                playBtn.disabled = false;
                clearBtn.disabled = false;
                stabilizeCheckbox.disabled = false;
                return;
            }

            isPlaying = true;
            trail = [];

            arm = {
                j1: HOME_J1_DEG,
                j2: HOME_J2_DEG
            };

            bladeDown = false;

            resetTrailingBlade();
            render();

            for (const run of runs) {
                if (run.approach) {
                    await animateTo(
                        run.approach,
                        speed,
                        false
                    );
                }

                await animateTo(
                    run.points[0],
                    speed,
                    false
                );

                bladeDown = true;
                render();

                for (
                    let index = 1;
                    index < run.points.length;
                    index++
                ) {
                    await animateTo(
                        run.points[index],
                        speed,
                        true
                    );
                }

                bladeDown = false;
                render();
            }

            isPlaying = false;
            playBtn.disabled = false;
            clearBtn.disabled = false;
            stabilizeCheckbox.disabled = false;
        }

        playBtn.addEventListener(
            'click',
            play
        );
    </script>
</body>
